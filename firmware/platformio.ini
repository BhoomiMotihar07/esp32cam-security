; ESP32-CAM (AI-Thinker) firmware. Arduino framework on ESP-IDF 4.4 (arduino-esp32 2.0.x).
;   pio run                       compile
;   pio run -t upload             flash (hold IO0 low / use the MB base board)
;   pio device monitor -b 115200  logs with fps and upload timings
[env:esp32cam]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; Partition: min_spiffs = two 1.9 MB app slots (OTA-capable) + 190 KB SPIFFS.
; Switch to huge_app.csv (3 MB app, no OTA) only if you add on-chip ESP-WHO face detection.
board_build.partitions = min_spiffs.csv

build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DCORE_DEBUG_LEVEL=1
  -DCONFIG_ARDUHAL_LOG_COLORS=0

lib_deps =
  bblanchon/ArduinoJson@^7.1.0

; Arduino IDE equivalents: board "AI Thinker ESP32-CAM" (or "ESP32 Wrover Module"),
; PSRAM enabled, partition "Minimal SPIFFS (1.9MB APP with OTA)", 115200 baud.
